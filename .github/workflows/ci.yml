name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  schedule:
    # Nightly scan at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  # ── Job 1: C++ build + unit tests ────────────────────────────────────────────
  cpp-build-test:
    name: C++ Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libre2-dev libicu-dev pkg-config

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: pip install pybind11

      - name: Build C++ extension
        run: |
          mkdir -p build
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
          cmake --build build --config Release

      - name: Copy .so to project root (matches dev layout)
        run: |
          find build -maxdepth 1 -name "crucible_policy*.so" -exec cp {} . \;

      - name: Verify Python import
        run: python3 -c "from crucible_policy import PolicyEngine; print('ok')"

      - name: Install Python test dependencies
        run: pip install pytest pytest-timeout

      - name: Run C++ engine unit tests
        run: pytest tests/unit/test_policy_engine.py tests/unit/test_policy_engine_lifecycle.py -v

      - name: Run GIL performance gate
        run: pytest tests/performance/test_gil_baseline.py -v -s

  # ── Job 2: Python tests + coverage ───────────────────────────────────────────
  python-test:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    needs: cpp-build-test

    env:
      # Use local LLM mode so no Azure calls are made during CI
      CRUCIBLE_USE_LOCAL_LLM: "true"
      DATABASE_URL: "sqlite:///./crucible_test.db"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-test-secret-not-for-production"
      AZURE_INFERENCE_KEY: "ci-placeholder"
      AZURE_INFERENCE_ENDPOINT: "https://placeholder.openai.azure.com"
      AZURE_CONTENT_SAFETY_KEY: "ci-placeholder"
      AZURE_CONTENT_SAFETY_ENDPOINT: "https://placeholder.cognitiveservices.azure.com"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libre2-dev libicu-dev pkg-config rustc cargo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pybind11
        run: pip install pybind11

      - name: Build C++ extension
        run: |
          mkdir -p build
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
          cmake --build build --config Release

      - name: Copy .so to project root
        run: |
          find build -maxdepth 1 -name "crucible_policy*.so" -exec cp {} . \;

      - name: Install Python dependencies
        run: |
          pip install -r requirements/base.txt \
                      -r requirements/pinned.txt \
                      -r requirements/dev.txt

      - name: Run unit + contract tests with coverage
        run: |
          pytest tests/unit/ tests/contracts/ \
            -v \
            --cov=crucible \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Job 3: Nightly scan (scheduled only) ─────────────────────────────────────
  nightly-scan:
    name: Nightly E2E Scan
    runs-on: ubuntu-latest
    # Only runs on the cron schedule, not on push/PR
    if: github.event_name == 'schedule'
    needs: python-test

    env:
      CRUCIBLE_USE_LOCAL_LLM: "true"
      DATABASE_URL: "sqlite:///./crucible_nightly.db"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "nightly-ci-secret"
      AZURE_INFERENCE_KEY: "ci-placeholder"
      AZURE_INFERENCE_ENDPOINT: "https://placeholder.openai.azure.com"
      AZURE_CONTENT_SAFETY_KEY: "ci-placeholder"
      AZURE_CONTENT_SAFETY_ENDPOINT: "https://placeholder.cognitiveservices.azure.com"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libre2-dev libicu-dev pkg-config rustc cargo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pybind11 and build C++ extension
        run: |
          pip install pybind11
          mkdir -p build
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
          cmake --build build --config Release

      - name: Copy .so to project root
        run: |
          find build -maxdepth 1 -name "crucible_policy*.so" -exec cp {} . \;

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for Ollama to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:11434/api/tags; do sleep 2; done'

      - name: Pull phi4-mini model
        run: ollama pull phi4-mini

      - name: Install Python dependencies
        run: |
          pip install -r requirements/base.txt \
                      -r requirements/pinned.txt \
                      -r requirements/dev.txt

      - name: Run E2E scan pipeline
        run: pytest tests/e2e/ -v -s --timeout=180

      - name: Run regression check
        run: pytest tests/performance/ -v -s --timeout=60

  # ── Job 4: Deploy to Azure Container Apps (push to main only) ────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: python-test
    # Only deploy when merging to main (not on PRs, not on schedule)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: crucible-api

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC — no static credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push production image
        run: |
          docker build \
            -f Dockerfile.prod \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name crucible-api \
            --resource-group crucible-rg \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          APP_URL=$(az containerapp show \
            --name crucible-api \
            --resource-group crucible-rg \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "App deployed at: https://$APP_URL"
          curl -sf "https://$APP_URL/health" | jq .
